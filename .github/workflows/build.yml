name: Build DocuSearch.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DocuSearch.NET.sln

      - name: Build
        run: dotnet build DocuSearch.NET.sln --configuration Release --no-restore

      - name: Publish self-contained
        run: |
          dotnet publish src/DocuSearch.Avalonia/DocuSearch.Avalonia.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output build/publish
        shell: pwsh

      - name: Download BGE model
        shell: pwsh
        run: |
          $dst = "build\publish\models\bge-small-en-v1.5"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main/onnx/model.onnx"
          $dest = Join-Path $dst "model.onnx"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing -UserAgent "Mozilla/5.0" -TimeoutSec 120
              if ((Get-Item $dest).Length -ge 40MB) { Write-Host "OK: model.onnx"; break }
            } catch { if ($i -ge 3) { throw }; Start-Sleep 5 }
          }

      - name: Verify
        shell: pwsh
        run: |
          $exe = "build\publish\DocuSearch.Avalonia.exe"
          if (Test-Path $exe) { Write-Host "Exe: $([math]::Round((Get-Item $exe).Length/1MB,1)) MB" }
          else { throw "exe not found" }
          $model = "build\publish\models\bge-small-en-v1.5\model.onnx"
          if (Test-Path $model) { Write-Host "Model: $([math]::Round((Get-Item $model).Length/1MB,1)) MB" }
          else { Write-Host "WARNING: model not found" }

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "build\publish\*" -DestinationPath "dist\DocuSearch.NET-portable.zip"
          Write-Host "ZIP: $([math]::Round((Get-Item 'dist\DocuSearch.NET-portable.zip').Length/1MB,1)) MB"

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: DocuSearch.NET-portable
          path: dist/DocuSearch.NET-portable.zip
          retention-days: 30

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: DocuSearch.NET-portable.zip
          subject-digest: sha256:${{ hashFiles('dist/DocuSearch.NET-portable.zip') }}
          push-to-registry: false
